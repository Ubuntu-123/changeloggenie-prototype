name: Test ChangelogGenie Action

on:
  workflow_dispatch:
    inputs:
      owner:
        description: GitHub repository owner
        required: false
        default: "Ubuntu-123"
      repo:
        description: GitHub repository name
        required: false
        default: "changeloggenie-prototype"
      start_date:
        description: Start date in YYYY-MM-DD format
        required: true
        default: "2026-05-20"
      end_date:
        description: End date in YYYY-MM-DD format
        required: true
        default: "2026-05-23"
      version:
        description: Optional changelog version label
        required: false
        default: "main-action-validation"

permissions:
  contents: read

jobs:
  test-action:
    runs-on: ubuntu-latest

    steps:
      - name: Generate changelog with ChangelogGenie
        uses: Ubuntu-123/changeloggenie-prototype@main
        with:
          owner: ${{ inputs.owner }}
          repo: ${{ inputs.repo }}
          start_date: ${{ inputs.start_date }}
          end_date: ${{ inputs.end_date }}
          version: ${{ inputs.version }}
          output_path: changelog-action-output.md
          github_token: ${{ github.token }}

      - name: Show generated changelog
        run: sed -n '1,120p' changelog-action-output.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog-action-output
          path: changelog-action-output.md
