name: Test ChangelogGenie Action

on:
  workflow_dispatch:
    inputs:
      owner:
        description: GitHub repository owner
        required: false
        default: "Ubuntu-123"
      repo:
        description: GitHub repository name
        required: false
        default: "changeloggenie-prototype"
      start_date:
        description: Start date in YYYY-MM-DD format
        required: true
        default: "2026-05-20"
      end_date:
        description: End date in YYYY-MM-DD format
        required: true
        default: "2026-05-23"
      version:
        description: Optional changelog version label
        required: false
        default: "v0.1.7-action-validation"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-changeloggenie-action.yml"
      - "action.yml"
      - "changelog_genie.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "CHANGELOG.md"

permissions:
  contents: read

jobs:
  test-action:
    runs-on: ubuntu-latest

    steps:
      - name: Generate changelog with ChangelogGenie
        uses: Ubuntu-123/changeloggenie-prototype@v0.1.7
        with:
          owner: ${{ github.event.inputs.owner || 'Ubuntu-123' }}
          repo: ${{ github.event.inputs.repo || 'changeloggenie-prototype' }}
          start_date: ${{ github.event.inputs.start_date || '2026-07-02' }}
          end_date: ${{ github.event.inputs.end_date || '2026-07-09' }}
          version: ${{ github.event.inputs.version || 'v0.1.7-action-validation' }}
          output_path: changelog-action-output.md
          github_token: ${{ github.token }}

      - name: Show generated changelog
        run: sed -n '1,120p' changelog-action-output.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog-action-output
          path: changelog-action-output.md
