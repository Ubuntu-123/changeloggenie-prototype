[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "changeloggenie-prototype"
version = "0.1.7"
description = "Lightweight read-only CLI and GitHub Action for generating categorized technical Markdown changelogs from GitHub commits."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Domnita Tudor" }
]
keywords = ["changelog", "release-notes", "github", "cli", "openai", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "requests",
  "openai>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Ubuntu-123/changeloggenie-prototype"
Repository = "https://github.com/Ubuntu-123/changeloggenie-prototype"
Issues = "https://github.com/Ubuntu-123/changeloggenie-prototype/issues"
Changelog = "https://github.com/Ubuntu-123/changeloggenie-prototype/blob/main/CHANGELOG.md"

[project.scripts]
changeloggenie = "changelog_genie:main"
changeloggenie-ai = "business_changelog_ai:main"

[tool.setuptools]
py-modules = ["changelog_genie", "business_changelog_ai"]
